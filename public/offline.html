<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0F1A24"><meta name="robots" content="noindex">
<title>No connection · TerraLink</title>
<style>
  html,body{margin:0;height:100%;background:#0F1A24;color:#E8EDF2;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));box-sizing:border-box}
  img{width:64px;height:64px;margin-bottom:20px}
  h1{font-size:22px;margin:0 0 8px}
  p{max-width:360px;margin:0 0 8px;color:#B6C2CE}
  .b{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
  .go{background:#FF7A1A;color:#0F1A24}.bk{background:#22313F;color:#E8EDF2}
</style>
</head>
<body>
<main>
  <img src="/assets/favicon.svg" alt="">
  <h1>No connection right now</h1>
  <p>TerraLink needs signal to load this page.</p>
  <p>If you were saving something, tap <b>Go back</b>. What you typed is usually still there, so you can save it again once you have signal.</p>
  <div class="b"><button class="bk" type="button" onclick="history.back()">Go back</button><button class="go" type="button" onclick="location.reload()">Try again</button></div>
</main>
<script>addEventListener('online', () => location.reload());</script>
</body>
</html>
