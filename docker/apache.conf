ServerName localhost
ServerTokens Prod
ServerSignature Off
# Traefik runs on the host network and connects from the Docker bridge gateway
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
<VirtualHost *:80>
    DocumentRoot /var/www/crm/public
    <Directory /var/www/crm/public>
        AllowOverride All
        Require all granted
    </Directory>
    SetEnvIf X-Forwarded-Proto https HTTPS=on
    Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
